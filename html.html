<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин - Главная</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="greeting">Добро пожаловать! 👋</h1>
            <p>Выберите раздел</p>
        </div>

        <div class="menu-grid">
            <div class="menu-item" onclick="openSection('products')">
                <div class="menu-icon products">🛍️</div>
                <div class="menu-text">
                    <h3>Товары</h3>
                    <p>Покупка робуксов и товаров</p>
                </div>
            </div>

            <div class="menu-item" onclick="openSection('communication')">
                <div class="menu-icon communication">💻</div>
                <div class="menu-text">
                    <h3>Коммуникации</h3>
                    <p>Отзывы и информация</p>
                </div>
            </div>

            <div class="menu-item" onclick="openSection('support')">
                <div class="menu-icon support">❓</div>
                <div class="menu-text">
                    <h3>Поддержка</h3>
                    <p>Помощь и консультация</p>
                </div>
            </div>
            
            <!-- Чат с админом (будет появляться после оформления заказа) -->
            <div class="menu-item hidden" id="adminChatItem" onclick="openAdminChat()">
                <div class="menu-icon admin-chat">💬</div>
                <div class="menu-text">
                    <h3>Чат с админом</h3>
                    <p>Обсуждение заказа</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
